name: Manual Deploy to UAT

on:
  pull_request:
    branches: [uat]
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Run validation only (no deployment)"
        required: true
        default: true
        type: boolean

jobs:
  validate:
    if: (github.event_name == 'pull_request' && github.base_ref == 'uat' && github.head_ref == 'dev') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/uat')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate UAT (JWT)
        run: |
          echo "${{ secrets.SF_SERVER_KEY }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.UAT_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.UAT_USERNAME }} \
            --instance-url https://test.salesforce.com \
            --alias uat-org

      - name: Validate via Manifest (Check-Only)
        if: ${{ github.event_name == 'pull_request' || inputs.validate_only }}
        run: |
          sf project deploy start \
            --manifest manifest/package.xml \
            --target-org uat-org \
            --test-level RunLocalTests \
            --ignore-conflicts \
            --wait 60 \
            --dry-run

      - name: Deploy via Manifest
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.validate_only }}
        run: |
          sf project deploy start \
            --manifest manifest/package.xml \
            --target-org uat-org \
            --test-level RunLocalTests \
            --ignore-conflicts \
            --wait 60
